# PRODUCTION stack (EC2): docker compose -f docker-compose.prod.yml up -d --build
# Only Caddy (the "web" service) is reachable from the internet.

services:
  db:
    image: postgis/postgis:18-3.6
    # The PostGIS image is published for amd64 only; Apple Silicon Macs run it
    # through Docker Desktop's emulation. Native on x86 EC2 instances (t3).
    platform: linux/amd64
    env_file: .env
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    # No "ports:" -- the database is only reachable by other containers
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    restart: unless-stopped
    # Uses the Dockerfile's default CMD (gunicorn)
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_TILE_URL: ${VITE_TILE_URL:-}
    env_file: .env
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - caddy_data:/data      # HTTPS certificates live here; keep this volume
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
